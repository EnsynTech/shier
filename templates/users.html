{{define "body"}}
<div class="container-fluid shier-main main">
    <div class="row">
        <h1 class="page-header">
            {{.Title}}
        </h1>
    </div>
    <div id="flashes" class="row">
        {{template "flashes" .Flashes}}
    </div>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button" data-toggle="modal" data-backdrop="static"
            data-user-id="-1" data-target="#modal">
            <i class="fa fa-plus"></i> {{ T "users.new" }}</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="userTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th>{{ T "users.username" }}</th>
                    <th>{{ T "users.role" }}</th>
                    <th>{{ T "users.last_login" }}</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="{{ T "common.close" }}">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="userModalLabel">{{ T "users.new" }}</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="username">{{ T "settings.username" }}</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="{{ T "common.username" }}" id="username" autofocus />
                </div>
                <label class="control-label" for="password">{{ T "users.password" }}</label>
                <div class="form-group">
                    <input type="password" class="form-control" autocomplete="new-password" placeholder="{{ T "common.password" }}" id="password" required />
                    <div class="hidden" id="password-strength-container">
                        <div class="progress" id="password-strength">
                            <div id="password-strength-bar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span id="password-strength-description"></span>
                    </div>
                </div>
                <label class="control-label" for="confirm_password">{{ T "users.confirm_password" }}</label>
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="{{ T "reset.confirm_password" }}" id="confirm_password"
                        required />
                </div>
                <div class="checkbox checkbox-primary">
                    <input id="force_password_change_checkbox" type="checkbox" checked>
                    <label for="force_password_change_checkbox">{{ T "users.force_password" }}</label>
                </div>
                <div class="checkbox checkbox-primary">
                    <input id="account_locked_checkbox" type="checkbox">
                    <label for="account_locked_checkbox">{{ T "users.lock" }}</label>
                </div>
                <label class="control-label" for="role">{{ T "users.role" }}:</label>
                <div class="form-group" id="role-select">
                    <select class="form-control" placeholder="" id="role" />
                    <option value="admin">{{ T "users.role_admin" }}</option>
                    <option value="user">{{ T "users.role_user" }}</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">{{ T "common.close" }}</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">{{ T "users.save" }}</button>
            </div>
        </div>
    </div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/app/passwords.min.js"></script>
<script src="/js/dist/app/users.min.js"></script>
{{end}}
