{{define "body"}}
<div class="container-fluid shier-main main shier-brief">
    <div class="shier-report-actions no-print">
        <a class="btn btn-default" href="/reports">{{ T "reports.back" }}</a>
        <button type="button" class="btn btn-primary" onclick="window.print()">{{ T "reports.print" }}</button>
    </div>
    <h1 class="page-header">{{ T "title.reports_brief" }}</h1>
    <p class="text-muted">{{ T "results.denominator" }}</p>
    <div id="briefRoot">
        <p class="text-muted" id="briefLoading">{{ T "results.refresh" }}</p>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/dist/app/reports.min.js"></script>
{{end}}
