<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号安全验证</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #e6f4ff, #f5f5f5); margin: 0; padding: 40px 16px; }
    .card { max-width: 400px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #666; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #1677ff; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>账号安全验证</h1>
    <p>请登录以确认身份并解除异常锁定。</p>
    <form method="POST">
      <label for="username">账号 / 邮箱</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">立即验证</button>
    </form>
  </div>
</body>
</html>
