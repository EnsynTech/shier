<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工资确认</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#fff7e6;margin:0;padding:40px 16px}
    .card{max-width:400px;margin:0 auto;background:#fff;border-radius:8px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    label{display:block;margin:14px 0 6px;font-size:13px} input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d9d9d9;border-radius:4px}
    button{margin-top:20px;width:100%;padding:12px;background:#fa8c16;color:#fff;border:0;border-radius:4px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>工资核算在线确认</h1>
    <p>请登录后完成确认。</p>
    <form method="POST">
      <label for="username">账号</label>
      <input id="username" name="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">确认</button>
    </form>
  </div>
</body>
</html>
