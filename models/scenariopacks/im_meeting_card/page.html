<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会议确认</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; margin: 0; padding: 32px 16px; }
    .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #666; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #52c41a; color: #fff; border: 0; border-radius: 4px; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>确认会议出席</h1>
    <p>即时通讯演练落地页。请填写工号或邮箱后确认出席。</p>
    <form method="POST">
      <label>工号 / 邮箱</label>
      <input name="username" type="text" required>
      <button type="submit">确认出席</button>
    </form>
  </div>
</body>
</html>
