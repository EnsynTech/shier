<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二次确认</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e6f4ff;margin:0;padding:40px 16px}
    .card{max-width:400px;margin:0 auto;background:#fff;border-radius:8px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
    img{margin:16px auto;display:block}
    form{text-align:left} label{display:block;margin:14px 0 6px;font-size:13px} input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d9d9d9;border-radius:4px}
    button{margin-top:20px;width:100%;padding:12px;background:#1677ff;color:#fff;border:0;border-radius:4px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>请使用手机扫码</h1>
    <p>邮件中的二维码与下方一致，完成扫码后填写信息。</p>
    <img src="{{.QRDataURI}}" width="160" height="160" alt="QR">
    <form method="POST">
      <label for="phone">手机号</label>
      <input id="phone" name="phone" type="tel" required>
      <label for="name">姓名</label>
      <input id="name" name="name" required>
      <button type="submit">提交确认</button>
    </form>
  </div>
</body>
</html>
