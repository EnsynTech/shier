<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加入会议</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; margin: 0; padding: 40px 16px; }
    .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #666; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #1677ff; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>加入视频会议</h1>
    <p>请确认身份后进入会议室。</p>
    <form method="POST">
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" placeholder="请输入姓名" required>
      <label for="employee_id">工号</label>
      <input id="employee_id" name="employee_id" type="text" placeholder="请输入工号" required>
      <button type="submit">进入会议</button>
    </form>
  </div>
</body>
</html>
