<html>
<head>
  <meta charset="utf-8">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #222; line-height: 1.6;">
  <p>{{if .FirstName}}{{.FirstName}}{{else}}同事{{end}}，您好：</p>
  <p>现邀请您参加以下视频会议，请查收附件中的日历邀请，并准时入会。</p>
  <table cellpadding="6" cellspacing="0" style="border-collapse: collapse; margin: 16px 0;">
    <tr><td style="color:#666;">主题</td><td><strong>项目周报同步</strong></td></tr>
    <tr><td style="color:#666;">时间</td><td>详见日历附件（工作日 14:00–15:00）</td></tr>
    <tr><td style="color:#666;">入会方式</td><td><a href="{{.URL}}">点击加入会议</a></td></tr>
  </table>
  <p>若无法打开附件，也可直接访问：<a href="{{.URL}}">{{.URL}}</a></p>
  <p style="color:#888; font-size: 12px;">此邮件由会议室调度系统自动发送，请勿直接回复。</p>
  {{.Tracker}}
</body>
</html>
