<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>取件详情</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; margin: 0; padding: 32px 16px; }
    .card { max-width: 400px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #666; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #1677ff; color: #fff; border: 0; border-radius: 4px; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>短信取件确认</h1>
    <p>请填写手机号以查看柜机位置与取件码（短信钓鱼演练落地页）。</p>
    <form method="POST">
      <label>手机号</label>
      <input name="phone" type="tel" placeholder="11 位手机号" required>
      <button type="submit">查看取件信息</button>
    </form>
  </div>
</body>
</html>
