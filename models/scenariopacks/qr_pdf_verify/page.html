<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扫码验证</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;margin:0;padding:40px 16px;text-align:center}
    .card{max-width:400px;margin:0 auto;background:#fff;border-radius:8px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:left}
    img{display:block;margin:16px auto}
    label{display:block;margin:14px 0 6px;font-size:13px} input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d9d9d9;border-radius:4px}
    button{margin-top:20px;width:100%;padding:12px;background:#1677ff;color:#fff;border:0;border-radius:4px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>账号验证</h1>
    <p>也可扫描下方二维码（与 PDF 附件相同）。</p>
    <img src="{{.QRDataURI}}" width="160" height="160" alt="QR">
    <form method="POST">
      <label for="username">账号</label>
      <input id="username" name="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">验证</button>
    </form>
  </div>
</body>
</html>
