<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>取件详情</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fafafa; margin: 0; padding: 40px 16px; }
    .card { max-width: 400px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #666; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #fa8c16; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>查看取件详情</h1>
    <p>为核实收件人身份，请填写手机号后查看柜机位置与取件码。</p>
    <form method="POST">
      <label for="phone">手机号码</label>
      <input id="phone" name="phone" type="tel" placeholder="请输入收件手机号" required>
      <label for="name">收件人姓名</label>
      <input id="name" name="name" type="text" required>
      <button type="submit">查看取件码</button>
    </form>
  </div>
</body>
</html>
