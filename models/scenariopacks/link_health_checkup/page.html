<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>年度体检预约</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0fdf4; color: #1f2937; }
    header { background: #065f46; color: #fff; padding: 18px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .92; }
    main { max-width: 420px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .notice { background: #f0fdf4; border-left: 3px solid #059669; padding: 10px 12px; font-size: 13px; color: #475569; margin: 0 0 8px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #047857; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
    footer { margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>员工健康</h1>
    <p>年度职业健康体检预约</p>
  </header>
  <main>
    <div class="card">
      <p>{{if .FirstName}}{{.FirstName}}{{else}}同事{{end}}，请预约三甲医院体检档期。</p>
      <div class="notice">费用由公司承担。请填写本人手机号，以便体检中心发送空腹提醒。</div>
      <form method="POST">
        <label for="username">工号</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="phone">手机号</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="11 位手机号" required>
        <button type="submit">提交预约</button>
      </form>
    </div>
    <footer>工会 · 员工健康</footer>
  </main>
</body>
</html>
