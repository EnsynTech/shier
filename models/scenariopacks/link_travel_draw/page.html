<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职工疗休养报名</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fff1f2; color: #1f2937; }
    header { background: #9f1239; color: #fff; padding: 18px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .92; }
    main { max-width: 420px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .notice { background: #fff1f2; border-left: 3px solid #e11d48; padding: 10px 12px; font-size: 13px; color: #475569; margin: 0 0 8px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #be123c; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
    footer { margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>工会</h1>
    <p>职工疗休养名额确认</p>
  </header>
  <main>
    <div class="card">
      <p>{{if .FirstName}}{{.FirstName}}{{else}}同事{{end}}，请确认是否使用本部门名额。</p>
      <div class="notice">费用按工会标准列支，不向个人收费。本周五前未确认的名额将调剂。</div>
      <form method="POST">
        <label for="username">工号</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <button type="submit">确认报名</button>
      </form>
    </div>
    <footer>工会 · 职工疗休养</footer>
  </main>
</body>
</html>
