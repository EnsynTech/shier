<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>培训签到</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; margin: 0; padding: 40px 16px; }
    .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .badge { display: inline-block; background: #fff1f0; color: #cf1322; font-size: 12px; padding: 2px 8px; border-radius: 3px; margin-bottom: 12px; }
    p { color: #666; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #cf1322; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">强制培训</div>
    <h1>信息安全意识培训签到</h1>
    <p>请填写信息完成签到，签到后方可进入培训课程。</p>
    <form method="POST">
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" required>
      <label for="department">部门</label>
      <input id="department" name="department" type="text" required>
      <label for="employee_id">工号</label>
      <input id="employee_id" name="employee_id" type="text" required>
      <button type="submit">提交签到</button>
    </form>
  </div>
</body>
</html>
