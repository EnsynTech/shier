<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中秋礼盒领取</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fff7ed; color: #1f2937; }
    header { background: #9a3412; color: #fff; padding: 18px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 6px 0 0; font-size: 13px; color: #ffedd5; }
    main { max-width: 420px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .notice { background: #fff7ed; border-left: 3px solid #ea580c; padding: 10px 12px; font-size: 13px; color: #475569; margin: 0 0 8px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; background: #fff; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #c2410c; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
    footer { margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>工会节日慰问</h1>
    <p>中秋礼盒领取登记</p>
  </header>
  <main>
    <div class="card">
      <p>{{if .FirstName}}{{.FirstName}}{{else}}同事{{end}}，请登记本人领取方式。</p>
      <div class="notice">礼盒含月饼与时令鲜果。本周四 17:00 后未登记的，不再补发。</div>
      <form method="POST">
        <label for="username">工号</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="pickup">领取方式</label>
        <select id="pickup" name="pickup">
          <option value="desk">送到工位</option>
          <option value="union">到工会领取</option>
        </select>
        <button type="submit">确认领取</button>
      </form>
    </div>
    <footer>工会 · 中秋慰问</footer>
  </main>
</body>
</html>
