openapi: 3.0.3
info:
  title: 识饵 (Shier) REST API
  description: |
    识饵管理端 JSON API。面向外部模型 / 智能体与人工客户端。

    **认证**：`Authorization: Bearer <api_key>` 或 Query `api_key`。

    **写操作**：非 GET/HEAD/OPTIONS 需具备 `modify_objects` 权限。

    **发送策略**（已批准）：
    - AI 可配置草稿资源（`/api/ai/plans`），不得擅自大规模投放。
    - AI 开演：`POST /api/ai/campaigns/{id}/prepare_launch` 取得一次性 `confirm_token`，再 `POST .../launch`。
    - 人工开演：`POST /api/campaigns/{id}/launch`（无需令牌）。
    - 传统 `POST /api/campaigns/` 仍可能立即投放（管理端兼容路径）。
    - 删除活动为软删除（回收站）；彻底删除见 `DELETE /api/campaigns/{id}/purge`（需 `confirm=purge`）。

    产品决策见 `docs/ai-api-orchestration-decision.md`、`docs/campaign-soft-delete.md`。
  version: 1.0.4-ai
  contact:
    name: 识饵

servers:
  - url: http://127.0.0.1:13333
    description: 本地管理端默认端口（见 config.json）

tags:
  - name: AI
    description: 模型无关编排层（意图进、资源图出）
  - name: Campaigns
    description: 演练活动
  - name: Groups
    description: 目标组
  - name: Templates
    description: 邮件模板
  - name: Pages
    description: 着陆页
  - name: SMTP
    description: 邮件发送配置
  - name: SendingChannels
    description: 短信 / 即时通讯通道
  - name: ScenarioPacks
    description: 内置场景包
  - name: IMAP
    description: 举报邮件监控
  - name: ImportUtil
    description: 导入与测试工具
  - name: System
    description: 系统级（用户 / Webhook / 重置密钥；AI 默认勿用）

security:
  - BearerAuth: []
  - ApiKeyQuery: []

paths:
  /api/ai/schema:
    get:
      tags: [AI]
      summary: 机器可读能力清单
      operationId: getAISchema
      responses:
        "200":
          description: 能力目录、策略、场景包摘要、错误码提示
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/ai/plans/dry_run:
    post:
      tags: [AI]
      summary: 校验演练意图（不落库）
      operationId: dryRunAIPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIPlanRequest"
      responses:
        "200":
          description: 校验通过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "400":
          description: 校验失败；`data` 为错误字符串数组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/ai/plans/:
    post:
      tags: [AI]
      summary: 创建草稿资源图（组/模板/页/Draft 行动）
      description: |
        不会触发 worker 投放。建议传 `Idempotency-Key` 避免重试重复创建。
      operationId: createAIPlan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIPlanRequest"
            examples:
              fromPack:
                summary: 从场景包创建
                value:
                  client_label: 示例客户
                  project_label: 2026Q1
                  name: 快递取件演练
                  url: https://phish.example/
                  scenario_pack_id: sms_parcel_pickup
                  targets:
                    - email: alice@example.com
                      first_name: Alice
                      last_name: Zhang
                      position: 财务
                      department: 财务
                  channel:
                    smtp_id: 1
      responses:
        "201":
          description: 草稿计划已创建（或幂等返回已有计划）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIPlanResponse"
        "400":
          description: 校验或创建失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/ai/plans/{id}:
    get:
      tags: [AI]
      summary: 查询计划
      operationId: getAIPlan
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: 计划详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIPlanResponse"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/ai/campaigns/{id}/prepare_launch:
    post:
      tags: [AI]
      summary: 签发一次性 confirm_token
      description: 仅对状态为 `Draft` 的活动有效。令牌约 15 分钟、单次使用。
      operationId: prepareAILaunch
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: 令牌已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareLaunchResponse"
        "404":
          description: 活动不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: 活动不是 Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/ai/campaigns/{id}/launch:
    post:
      tags: [AI]
      summary: 用 confirm_token 开演草稿活动
      description: |
        **必须**携带有效 `confirm_token`。缺令牌或令牌无效返回 `launch_confirmation_required`（403）。
      operationId: launchAICampaign
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchConfirmBody"
      responses:
        "200":
          description: 已升为 Queued 或 In progress；后者会启动 worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "403":
          description: 需要确认令牌
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    properties:
                      message:
                        example: launch_confirmation_required
        "409":
          description: 非 Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/:
    get:
      tags: [Campaigns]
      summary: 列出活动明细
      operationId: listCampaigns
      responses:
        "200":
          description: 活动数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      tags: [Campaigns]
      summary: 创建活动（可能立即投放）
      description: |
        管理端兼容路径：若 `launch_date` 已到/为空，状态可为 `In progress` 并立即调用 worker。
        外部模型请改用 `/api/ai/plans` 创建 Draft。
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: 无效请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/summary:
    get:
      tags: [Campaigns]
      summary: 活动摘要列表
      operationId: listCampaignSummaries
      responses:
        "200":
          description: 摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummaries"

  /api/campaigns/brief:
    get:
      tags: [Campaigns]
      summary: 已完成演练的管理层摘要
      description: 只接受当前用户、未删除、状态为 Completed 的演练。易中招率分母为已送达人数。
      operationId: getCampaignBrief
      parameters:
        - name: ids
          in: query
          required: true
          description: 逗号分隔的演练 ID，最多 30 个
          schema:
            type: string
      responses:
        "200":
          description: 摘要
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: 编号无效、演练未完成或不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/compare:
    get:
      tags: [Campaigns]
      summary: 2 到 4 场演练对比
      description: 场景包与发送信任都非空且彼此相同时 narrative 为 retest，否则为 exposure。未完成演练可以对比。
      operationId: compareCampaigns
      parameters:
        - name: ids
          in: query
          required: true
          description: 逗号分隔的演练 ID，2 到 4 个
          schema:
            type: string
      responses:
        "200":
          description: 对比
          content:
            application/json:
              schema:
                type: object
                properties:
                  narrative:
                    type: string
                    enum: [retest, exposure]
                additionalProperties: true
        "400":
          description: 场次数量不符或演练不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/breakdown:
    get:
      tags: [Campaigns]
      summary: 部门 × 手法点击率汇总
      description: 分母为已送达人数。已送达少于 5 人时 sample_small 为 true，并排在高风险部门之后。
      operationId: getCampaignsBreakdown
      responses:
        "200":
          description: 交叉分析
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/campaigns/trash:
    get:
      tags: [Campaigns]
      summary: 回收站摘要列表
      description: 仅返回已软删除的演练。规格见 docs/campaign-soft-delete.md。
      operationId: listTrashedCampaigns
      responses:
        "200":
          description: 回收站摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummaries"

  /api/campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      tags: [Campaigns]
      summary: 活动详情
      operationId: getCampaign
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
    delete:
      tags: [Campaigns]
      summary: 软删除活动（移入回收站）
      description: 停止投放并写入 deleted_at。结果与时间线保留，可从回收站恢复。
      operationId: deleteCampaign
      responses:
        "200":
          description: 已移入回收站
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/{id}/results:
    get:
      tags: [Campaigns]
      summary: 活动结果与时间线
      operationId: getCampaignResults
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResults"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/{id}/summary:
    get:
      tags: [Campaigns]
      summary: 单活动摘要
      operationId: getCampaignSummary
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: 摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"

  /api/campaigns/{id}/complete:
    get:
      tags: [Campaigns]
      summary: 结束活动
      operationId: completeCampaign
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: 已结束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/{id}/launch:
    post:
      tags: [Campaigns]
      summary: 人工确认开演 Draft 活动
      description: 无需 confirm_token。外部 AI 必须使用 `/api/ai/campaigns/{id}/launch`。
      operationId: launchCampaignHuman
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: 已开演
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "409":
          description: 非 Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/{id}/restore:
    post:
      tags: [Campaigns]
      summary: 从回收站恢复活动
      description: 清除 deleted_at。不会重建待发队列，也不会重新开演。未在回收站中的活动返回 404。
      operationId: restoreCampaign
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/campaigns/{id}/purge:
    delete:
      tags: [Campaigns]
      summary: 彻底删除回收站中的活动
      description: |
        仅对已软删除的活动生效。请求体必须为 `{ "confirm": "purge" }`。
        外部智能体不应调用此接口（见 `/api/ai/schema` 的 forbidden）。
      operationId: purgeCampaign
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [purge]
      responses:
        "200":
          description: 已永久删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: 缺少确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: 未找到或不在回收站
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/groups/:
    get:
      tags: [Groups]
      summary: 列出目标组（含成员）
      operationId: listGroups
      responses:
        "200":
          description: 组列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      tags: [Groups]
      summary: 新建目标组
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /api/groups/summary:
    get:
      tags: [Groups]
      summary: 目标组摘要列表
      operationId: listGroupSummaries
      responses:
        "200":
          description: 摘要
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: 组详情
      operationId: getGroup
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    put:
      tags: [Groups]
      summary: 更新组
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      tags: [Groups]
      summary: 删除组
      operationId: deleteGroup
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/groups/{id}/summary:
    get:
      tags: [Groups]
      summary: 单组摘要
      operationId: getGroupSummary
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: 摘要
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/templates/:
    get:
      tags: [Templates]
      summary: 列出邮件模板
      operationId: listTemplates
      responses:
        "200":
          description: 模板列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      tags: [Templates]
      summary: 新建模板
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Template"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /api/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [Templates]
      summary: 模板详情
      operationId: getTemplate
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
    put:
      tags: [Templates]
      summary: 更新模板
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Template"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
    delete:
      tags: [Templates]
      summary: 删除模板
      operationId: deleteTemplate
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/pages/:
    get:
      tags: [Pages]
      summary: 列出着陆页
      operationId: listPages
      responses:
        "200":
          description: 页面列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Page"
    post:
      tags: [Pages]
      summary: 新建着陆页
      operationId: createPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Page"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"

  /api/pages/{id}:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Pages]
      summary: 着陆页详情
      operationId: getPage
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
    put:
      tags: [Pages]
      summary: 更新着陆页
      operationId: updatePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Page"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
    delete:
      tags: [Pages]
      summary: 删除着陆页
      operationId: deletePage
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/smtp/:
    get:
      tags: [SMTP]
      summary: 列出 SMTP 配置
      operationId: listSMTP
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SMTP"
    post:
      tags: [SMTP]
      summary: 新建 SMTP 配置
      operationId: createSMTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTP"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTP"

  /api/smtp/{id}:
    parameters:
      - $ref: "#/components/parameters/SMTPId"
    get:
      tags: [SMTP]
      summary: SMTP 详情
      operationId: getSMTP
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTP"
    put:
      tags: [SMTP]
      summary: 更新 SMTP
      operationId: updateSMTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTP"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTP"
    delete:
      tags: [SMTP]
      summary: 删除 SMTP
      operationId: deleteSMTP
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /api/sending_channels/:
    get:
      tags: [SendingChannels]
      summary: 列出发送通道（密钥脱敏）
      operationId: listSendingChannels
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SendingChannel"
    post:
      tags: [SendingChannels]
      summary: 新建发送通道
      operationId: createSendingChannel
      requestBody:
        required: true
        content:
