components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: "Authorization: Bearer <api_key>"
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key

  parameters:
    CampaignId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GroupId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TemplateId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SMTPId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SendingChannelId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: 创建计划时的幂等键；相同键返回已有计划

  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: 可选附加数据
          nullable: true

    AIPlanTarget:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        position:
          type: string
          description: 常映射为部门展示
        phone:
          type: string
        department:
          type: string

    AIPlanChannel:
      type: object
      description: smtp_id 与 sending_channel_id 二选一
      properties:
        smtp_id:
          type: integer
          format: int64
        sending_channel_id:
          type: integer
          format: int64

    AIPlanSchedule:
      type: object
      properties:
        launch_date:
          type: string
          format: date-time
        send_by_date:
          type: string
          format: date-time

    AIPlanRequest:
      type: object
      required: [url, channel]
      properties:
        client_label:
          type: string
        project_label:
          type: string
        name:
          type: string
          description: 活动名称；可空则自动生成
        url:
          type: string
          format: uri
          description: 钓鱼监听可达 URL
        scenario_pack_id:
          type: string
          description: 与 template_id+page_id 二选一（优先场景包）
        template_id:
          type: integer
          format: int64
        page_id:
          type: integer
          format: int64
        group_id:
          type: integer
          format: int64
          description: 与 targets 二选一
        targets:
          type: array
          items:
            $ref: "#/components/schemas/AIPlanTarget"
        channel:
          $ref: "#/components/schemas/AIPlanChannel"
        schedule:
          $ref: "#/components/schemas/AIPlanSchedule"

    AIPlanResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [draft, launched]
        client_label:
          type: string
        project_label:
          type: string
        group_id:
          type: integer
          format: int64
        template_id:
          type: integer
          format: int64
        page_id:
          type: integer
          format: int64
        campaign_id:
          type: integer
          format: int64
        smtp_id:
          type: integer
          format: int64
        sending_channel_id:
          type: integer
          format: int64
        scenario_pack_id:
          type: string
        warnings:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    PrepareLaunchResponse:
      type: object
      properties:
        campaign_id:
          type: integer
          format: int64
        confirm_token:
          type: string
        expires_at:
          type: string
          format: date-time

    LaunchConfirmBody:
      type: object
      required: [confirm_token]
      properties:
        confirm_token:
          type: string

    NamedRef:
      type: object
      properties:
        name:
          type: string
      description: 创建活动时常用 name 引用已有资源

    Target:
      type: object
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        position:
          type: string
        phone:
          type: string
        department:
          type: string

    Group:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        modified_date:
          type: string
          format: date-time
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"

    Template:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        subject:
          type: string
        text:
          type: string
        html:
          type: string
        scenario_pack_id:
          type: string
        difficulty:
          type: integer
        industries:
          type: array
          items:
            type: string
        techniques:
          type: array
          items:
            type: string
      additionalProperties: true

    Page:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        html:
          type: string
        capture_credentials:
          type: boolean
        capture_passwords:
          type: boolean
        redirect_url:
          type: string
      additionalProperties: true

    SMTP:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        host:
          type: string
        from_address:
          type: string
        username:
          type: string
        password:
          type: string
        ignore_cert_errors:
          type: boolean
      additionalProperties: true

    SendingChannel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        channel:
          type: string
          description: sms 或 im
        config:
          type: object
          additionalProperties: true
      additionalProperties: true

    ScenarioPackSummary:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        title:
          type: string
        description:
          type: string
        has_attachment:
          type: boolean
        has_qr:
          type: boolean
        difficulty:
          type: integer
        industries:
          type: array
          items:
            type: string
        techniques:
          type: array
          items:
            type: string

    ScenarioPackImportResult:
      type: object
      properties:
        template_id:
          type: integer
          format: int64
        template_name:
          type: string
        page_id:
          type: integer
          format: int64
        page_name:
          type: string

    CampaignCreate:
      type: object
      required: [name, url, groups, template, page]
      properties:
        name:
          type: string
        url:
          type: string
        launch_date:
          type: string
          format: date-time
        send_by_date:
          type: string
          format: date-time
        channel:
          type: string
          enum: [email, sms, im]
        groups:
          type: array
          items:
            $ref: "#/components/schemas/NamedRef"
        template:
          $ref: "#/components/schemas/NamedRef"
        page:
          $ref: "#/components/schemas/NamedRef"
        smtp:
          $ref: "#/components/schemas/NamedRef"
        sending_channel:
          $ref: "#/components/schemas/NamedRef"
        sending_channel_id:
          type: integer
          format: int64
        sending_trust:
          type: string
          enum: ["", customer_domain, lookalike]
          description: 空字符串表示未标注。管理界面发起时必选。

    Campaign:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_date:
          type: string
          format: date-time
        launch_date:
          type: string
          format: date-time
        send_by_date:
          type: string
          format: date-time
        completed_date:
          type: string
          format: date-time
        status:
          type: string
          enum: [Draft, Queued, "In progress", "Emails Sent", Completed, Created]
        url:
          type: string
        channel:
          type: string
        template:
          $ref: "#/components/schemas/Template"
        page:
          $ref: "#/components/schemas/Page"
        smtp:
          $ref: "#/components/schemas/SMTP"
        sending_channel:
          $ref: "#/components/schemas/SendingChannel"
        sending_channel_id:
          type: integer
          format: int64
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
        scenario_pack_id:
          type: string
        difficulty:
          type: integer
        industries:
          type: array
          items:
            type: string
        techniques:
          type: array
          items:
            type: string
        sending_trust:
          type: string
          enum: ["", customer_domain, lookalike]
        deleted_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true

    CampaignResults:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        scenario_pack_id:
          type: string
        difficulty:
          type: integer
        sending_trust:
          type: string
          enum: ["", customer_domain, lookalike]
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    CampaignSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        scenario_pack_id:
          type: string
        difficulty:
          type: integer
        industries:
          type: array
          items:
            type: string
        techniques:
          type: array
          items:
            type: string
        sending_trust:
          type: string
          enum: ["", customer_domain, lookalike]
        created_date:
          type: string
          format: date-time
        launch_date:
          type: string
          format: date-time
        stats:
          type: object
          description: sent 含后来打开、点击或提交的人。send_success_rate 为 sent / (sent + error)，重试中的人不进分母；尚无已结束发送时省略。
          properties:
            total:
              type: integer
              format: int64
            sent:
              type: integer
              format: int64
            opened:
              type: integer
              format: int64
            clicked:
              type: integer
              format: int64
            submitted_data:
              type: integer
              format: int64
            email_reported:
              type: integer
              format: int64
            email_replied:
              type: integer
              format: int64
            error:
              type: integer
              format: int64
            retrying:
              type: integer
              format: int64
            send_success_rate:
              type: number
              nullable: true
              description: 已接受人数除以已接受与永久失败之和。
          additionalProperties: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true

    CampaignSummaries:
      type: object
      properties:
        total:
          type: integer
          format: int64
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/CampaignSummary"
